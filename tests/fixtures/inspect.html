<!doctype html>
<meta charset="utf-8">
<title>Inspection fixture: a cutaway box and a panel</title>
<style>#VRButton { position: fixed; z-index: 10; top: 8px; left: 8px; }</style>
<button id="VRButton">ENTER VR</button>
<canvas id="world"></canvas>
<script>
  // World units are metres. local-floor is the tracking space in IWER, so scene
  // coordinates here are also tracking coordinates.
  const canvas = document.querySelector('#world');
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  const gl = canvas.getContext('webgl2', { xrCompatible: true });

  const quad = (a, b, c, d, color) => [a, b, c, a, c, d].flatMap(p => [...p, ...color]);
  const box = ([cx, cy, cz], s, colors) => {
    const p = (x, y, z) => [cx + x * s, cy + y * s, cz + z * s];
    return [
      // The front face (+Z) is cut away, leaving the interior visible.
      quad(p(-1, -1, -1), p(1, -1, -1), p(1, 1, -1), p(-1, 1, -1), colors.back),
      quad(p(-1, -1, -1), p(-1, -1, 1), p(-1, 1, 1), p(-1, 1, -1), colors.left),
      quad(p(1, -1, -1), p(1, -1, 1), p(1, 1, 1), p(1, 1, -1), colors.right),
      quad(p(-1, -1, -1), p(1, -1, -1), p(1, -1, 1), p(-1, -1, 1), colors.floor),
    ].flat();
  };
  window.scene = {
    cutaway: [0, 1.4, -1.5],
    panel: [0.9, 1.5, -1.5],
    marker: [0, 1.4, -1.6],
  };
  const { cutaway, panel, marker } = window.scene;
  const dot = 0.015;
  const vertices = new Float32Array([
    ...box(cutaway, 0.2, { back: [0.3, 0.3, 0.8], left: [0.8, 0.3, 0.3], right: [0.8, 0.8, 0.3], floor: [0.5, 0.5, 0.5] }),
    ...quad([panel[0] - 0.2, panel[1] - 0.3, panel[2]], [panel[0] + 0.2, panel[1] - 0.3, panel[2]],
      [panel[0] + 0.2, panel[1] + 0.3, panel[2]], [panel[0] - 0.2, panel[1] + 0.3, panel[2]], [0.9, 0.9, 0.9]),
    // Pure green, used nowhere else, inside the box in front of its back wall.
    ...quad([marker[0] - dot, marker[1] - dot, marker[2]], [marker[0] + dot, marker[1] - dot, marker[2]],
      [marker[0] + dot, marker[1] + dot, marker[2]], [marker[0] - dot, marker[1] + dot, marker[2]], [0, 1, 0]),
  ]);
  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    return shader;
  };
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, `#version 300 es
    in vec3 position; in vec3 color; out vec3 c; uniform mat4 P, V;
    void main() { c = color; gl_Position = P * V * vec4(position, 1.0); }`));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `#version 300 es
    precision mediump float; in vec3 c; out vec4 o;
    void main() { o = vec4(c, 1.0); }`));
  gl.linkProgram(program);
  gl.useProgram(program);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
  for (const [name, offset] of [['position', 0], ['color', 12]]) {
    const location = gl.getAttribLocation(program, name);
    gl.enableVertexAttribArray(location);
    gl.vertexAttribPointer(location, 3, gl.FLOAT, false, 24, offset);
  }
  const P = gl.getUniformLocation(program, 'P');
  const V = gl.getUniformLocation(program, 'V');
  window.framesRendered = 0;

  document.querySelector('#VRButton').onclick = async () => {
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
    window.session = session;
    const space = await session.requestReferenceSpace('local-floor');
    session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
    gl.enable(gl.DEPTH_TEST);
    const render = (_time, frame) => {
      const layer = session.renderState.baseLayer;
      gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
      gl.clearColor(0.05, 0.05, 0.08, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      for (const view of frame.getViewerPose(space)?.views ?? []) {
        const vp = layer.getViewport(view);
        if (!vp.width) continue;
        gl.viewport(vp.x, vp.y, vp.width, vp.height);
        gl.uniformMatrix4fv(P, false, view.projectionMatrix);
        gl.uniformMatrix4fv(V, false, view.transform.inverse.matrix);
        gl.drawArrays(gl.TRIANGLES, 0, vertices.length / 6);
      }
      framesRendered++;
      session.requestAnimationFrame(render);
    };
    session.requestAnimationFrame(render);
  };
</script>
